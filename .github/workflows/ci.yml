name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # node:test and jest run on Node; Node >= 22.18 strips TypeScript types natively.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  anvil:
    # Everything that needs a real anvil. The Base e2e replays the committed fork recording
    # (packages/forkit/.forkit-cache) offline: deterministic, no RPC, no rate limits.
    # Two anvils: the oldest supported and stable. anvil 1.8 changed how it reads fork state
    # (block-hash pins, upstream probes), so both are covered.
    name: anvil tests + e2e (offline replay, anvil ${{ matrix.foundry }})
    strategy:
      fail-fast: false
      matrix:
        foundry: [v1.7.1, stable]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ matrix.foundry }}
      - run: anvil --version
      - run: bun install --frozen-lockfile
      - run: bun run test:anvil
      - run: bun run test:e2e
        env:
          FORKIT_CACHE: offline

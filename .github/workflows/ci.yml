name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # node:test and jest run on Node; Node >= 22.18 strips TypeScript types natively.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # examples/* import @condensate/forkit as users do, from its built dist/.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  pack:
    # What `npm install @condensate/forkit` gets: pack, install into a fresh project, and import it
    # from node_modules under node:test, jest, vitest and bun:test; typecheck a strict consumer;
    # run the `forkit` bin.
    name: packed install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test:pack

  site:
    # The Vocs docs site (site/): static build under /forkit/ straight from the clone, an offline
    # link check of everything the built pages reference, and a typecheck. Not deployed from here.
    name: site build + link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # From the clean clone: site:build installs site/'s own dependencies itself.
      - run: bun run site:build
      - run: bun run site:check
      - run: bun run site:typecheck

  screens:
    # forkit explore's UI, and the built site (home and a docs page, light and dark), in headless
    # Chromium at 390 and 1440 px. The PNGs are an artifact for review; they are never committed.
    name: explorer + site screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
        working-directory: packages/forkit
      - run: bun run site:build
      - run: bun run test:screens
        env:
          FORKIT_SCREENS_DIR: ${{ runner.temp }}/forkit-screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/forkit-screens
          retention-days: 14

  anvil:
    # Everything that needs a real anvil. The Base e2e replays the committed fork recording
    # (packages/forkit/.forkit-cache) offline: deterministic, no RPC, no rate limits.
    # Two anvils: the oldest supported and stable. anvil 1.8 changed how it reads fork state
    # (block-hash pins, upstream probes), so both are covered.
    name: anvil tests + e2e (offline replay, anvil ${{ matrix.foundry }})
    strategy:
      fail-fast: false
      matrix:
        foundry: [v1.7.1, stable]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ matrix.foundry }}
      - run: anvil --version
      - run: bun install --frozen-lockfile
      - run: bun run test:anvil
      - run: bun run test:e2e
        env:
          FORKIT_CACHE: offline
      # examples/*: each replays its own committed recording (examples/*/.forkit-cache), against
      # forkit's built dist/.
      - run: bun run build
      - run: bun run test:examples
        env:
          FORKIT_CACHE: offline
